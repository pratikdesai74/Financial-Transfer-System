version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: transfers-db
    environment:
      POSTGRES_DB: transfers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transfers"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transfers-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transfers-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: transfers
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - transfers-network

volumes:
  postgres_data:

networks:
  transfers-network:
    driver: bridge
